name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"

      - name: Fetch sources
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          dotnet test --project test/Tmds2.DBus.Tests
          dotnet test --project test/Tmds2.DBus.Protocol.Tests
          dotnet test --project test/Tmds2.DBus.Generator.Tests

      - name: Build tool
        run: |
          pushd src/Tmds2.DBus.Tool && dotnet build && popd

      - name: Build examples
        run: |
          dotnet build examples/Introspect
          dotnet build examples/MediaPlayerRemote
          dotnet build examples/NetworkManager

      - name: Build packages
        run: |
          VERSION_SUFFIX="${{ github.run_number }}-${{ github.sha }}"
          dotnet pack src/Tmds2.DBus --configuration Release --output src/Tmds2.DBus /p:VersionSuffix="$VERSION_SUFFIX"
          dotnet pack src/Tmds2.DBus.Protocol --configuration Release --output src/Tmds2.DBus.Protocol /p:VersionSuffix="$VERSION_SUFFIX"
          dotnet pack src/Tmds2.DBus.Generator --configuration Release --output src/Tmds2.DBus.Generator /p:VersionSuffix="$VERSION_SUFFIX"
          dotnet pack src/Tmds2.DBus.Tool --configuration Release --output src/Tmds2.DBus.Tool /p:VersionSuffix="$VERSION_SUFFIX"

      - name: Publish packages
        run: |
          dotnet nuget push -s https://www.myget.org/F/tmds/api/v2/package -k "${{ secrets.NUGET_APIKEY }}" src/Tmds2.DBus/*.nupkg
          dotnet nuget push -s https://www.myget.org/F/tmds/api/v2/package -k "${{ secrets.NUGET_APIKEY }}" src/Tmds2.DBus.Protocol/*.nupkg
          dotnet nuget push -s https://www.myget.org/F/tmds/api/v2/package -k "${{ secrets.NUGET_APIKEY }}" src/Tmds2.DBus.Generator/*.nupkg
          dotnet nuget push -s https://www.myget.org/F/tmds/api/v2/package -k "${{ secrets.NUGET_APIKEY }}" src/Tmds2.DBus.Tool/*.nupkg
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
